apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://nextcloud.github.io/helm/
    chart: nextcloud
    targetRevision: "8.9.0"
    helm:
      values: |
        global:
          security:
            allowInsecureImages: true
        replicaCount: 3
        nextcloud:
          host: nextcloud.apocalypso.xyz
          existingSecret:
            enabled: true
            secretName: nextcloud-secrets
            usernameKey: username
            passwordKey: password
          trustedDomains:
            - nextcloud.apocalypso.xyz
          # SMTP via Mailgun (env vars per https://github.com/nextcloud/docker#e-mail-smtp-configuration)
          extraEnv:
            - name: SMTP_HOST
              value: smtp.mailgun.org
            - name: SMTP_SECURE
              value: tls
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_AUTHTYPE
              value: LOGIN
            - name: SMTP_NAME
              valueFrom:
                secretKeyRef:
                  name: smtp-mailgun
                  key: smtp-email
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-mailgun
                  key: smtp-password
            - name: MAIL_FROM_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: smtp-mailgun
                  key: smtp-email
            - name: MAIL_DOMAIN
              value: apocalypso.xyz
            # Force rsync to use --chown root:root instead of www-data:www-data
            # root maps to k8s-nfs via NFS Mapall, so files end up owned correctly
            - name: APACHE_RUN_USER
              value: "#0"
            - name: APACHE_RUN_GROUP
              value: "#0"
          # Run as root (image default) so Apache can bind port 80
          extraInitContainers:
            # Prepare volume directories with correct ownership
            - name: prepare-volume
              image: docker.io/library/busybox:1.36
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 0
              volumeMounts:
                - name: nextcloud-main
                  mountPath: /data
              command:
                - /bin/sh
                - -c
                - |
                  echo "Preparing volume directories..."
                  rm -rf /data/* /data/.[!.]* 2>/dev/null || true
                  for dir in html root config custom_apps data themes tmp; do
                    mkdir -p /data/$dir
                    chmod 777 /data/$dir
                    chown 1000:1000 /data/$dir 2>/dev/null || true
                  done
                  ls -la /data/
        internalDatabase:
          enabled: false
        externalDatabase:
          enabled: false
        postgresql:
          enabled: true
          # Match paperless/mealie/joplin: run as 1000 so NFS Mapall (k8s-nfs) ownership matches
          volumePermissions:
            enabled: true
            # Bitnami os-shell tag pinned by subchart may not exist; use busybox for chown/mkdir/chmod
            image:
              registry: docker.io
              repository: library/busybox
              tag: "1.36"
          auth:
            existingSecret: nextcloud-secrets
            secretKeys:
              userPasswordKey: db-password
              adminPasswordKey: postgres-password
              replicationPasswordKey: db-replication-password
          architecture: replication
          primary:
            podSecurityContext:
              fsGroup: 1000
            containerSecurityContext:
              runAsUser: 1000
              runAsGroup: 1000
            persistence:
              enabled: true
              size: 50Gi
              storageClass: nfs-csi
            resources:
              requests:
                memory: "2Gi"
                cpu: "2000m"
              limits:
                memory: "8Gi"
                cpu: "8000m"
          readReplicas:
            replicaCount: 2
            podSecurityContext:
              fsGroup: 1000
            containerSecurityContext:
              runAsUser: 1000
              runAsGroup: 1000
            persistence:
              enabled: true
              size: 50Gi
              storageClass: nfs-csi
            resources:
              requests:
                memory: "1Gi"
                cpu: "500m"
              limits:
                memory: "2Gi"
                cpu: "1000m"
        redis:
          enabled: true
          auth:
            existingSecret: nextcloud-secrets
            existingSecretPasswordKey: redis-password
          architecture: replication
          sentinel:
            enabled: false
          master:
            persistence:
              enabled: true
              size: 8Gi
              storageClass: nfs-csi
            resources:
              requests:
                memory: "1Gi"
                cpu: "1000m"
              limits:
                memory: "2Gi"
                cpu: "2000m"
          replica:
            replicaCount: 3
            persistence:
              enabled: true
              size: 8Gi
              storageClass: nfs-csi
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"
        cronjob:
          enabled: true
          type: cronjob
          cronjob:
            schedule: "*/5 * * * *"
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
        persistence:
          enabled: true
          size: 8Ti
          storageClass: nfs-csi
          accessMode: ReadWriteMany
        ingress:
          enabled: true
          className: nginx
          hosts:
            - nextcloud.apocalypso.xyz
          path: /
          pathType: Prefix
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            nginx.ingress.kubernetes.io/proxy-body-size: "10G"
            nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
            nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
            external-dns.alpha.kubernetes.io/controller: "false"
            gethomepage.dev/enabled: "true"
            gethomepage.dev/group: User Services
            gethomepage.dev/name: Nextcloud
            gethomepage.dev/icon: nextcloud
            gethomepage.dev/description: File sync and share
          tls:
            - secretName: nextcloud-tls
              hosts:
                - nextcloud.apocalypso.xyz
        phpClientHttpsFix:
          enabled: true
          protocol: https
        resources:
          requests:
            memory: "2Gi"
            cpu: "2000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: nextcloud
        service:
          sessionAffinity: ""
        extraManifests:
          - |
            apiVersion: onepassword.com/v1
            kind: OnePasswordItem
            metadata:
              name: nextcloud-secrets
              namespace: nextcloud
            spec:
              itemPath: "vaults/starbase/items/nextcloud"
          - |
            apiVersion: onepassword.com/v1
            kind: OnePasswordItem
            metadata:
              name: smtp-mailgun
              namespace: nextcloud
            spec:
              itemPath: "vaults/starbase/items/mailgun"
  destination:
    server: https://kubernetes.default.svc
    namespace: nextcloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
